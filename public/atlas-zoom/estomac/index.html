.lv .n{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font:800 9.5px var(--sans);color:#1a1d21;background:var(--chalk)}
.lv.on .n{background:var(--acc)}

.card{position:fixed;z-index:8;right:78px;top:84px;width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 190px);overflow:auto;padding:20px 22px 18px;border-radius:24px;opacity:0;transform:translateX(18px) scale(.98);pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease);scrollbar-width:none}

.card .chip{display:inline-flex;align-items:center;gap:7px;font:700 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}.card .chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.card.portal .chip i{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
.card h3{margin:8px 34px 10px 0;font:700 26px/1.12 var(--hand);color:var(--chalk)}
.card p{margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--soft)}.card p b{color:#fff;font-weight:650}
.trap{position:relative;margin:12px 0 4px;padding:12px 14px 12px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,120,90,.15),rgba(255,120,90,.04));border:1px solid rgba(255,140,110,.3);font-size:13.2px;line-height:1.55;color:#f6e3dc}

#loader h1{margin:0;font:700 44px var(--hand);color:var(--chalk);text-align:center}#loader p{margin:6px 0 22px;color:var(--soft);font-size:14px;text-align:center}

@media (max-width:1050px){.lv .t{display:none}.lv{padding:6px}.crumb .path{display:none}}
@media (max-width:760px){

}

</style>

    { x: .543, y: .699, t: 'Cercle de la grande courbure', p: '<b>Artères gastro-omentales droite</b> (de la gastro-duodénale) et <b>gauche</b> (de l’artère splénique), anastomosées dans le <b>grand omentum</b> à environ 1 cm de la grande courbure ; elles donnent des rameaux gastriques et épiploïques.', trap: '« Gastro-épiploïque » et « gastro-omentale » désignent la même artère (ancienne / nouvelle nomenclature) : les deux termes tombent à l’EMD.' },
    { x: .655, y: .251, t: 'Vaisseaux courts', p: '3 à 5 <b>artères gastriques courtes</b>, branches de l’<b>artère splénique</b>, gagnent le <b>fundus</b> par le <b>ligament gastro-splénique</b>.', trap: 'Ils sont sectionnés lors d’une splénectomie ou d’une fundoplicature de Nissen : le fundus reste vascularisé par les autres cercles (et l’artère gastrique postérieure, inconstante).' },
    { x: .317, y: .248, t: 'Veine porte & veine gastrique gauche', p: 'Les veines suivent les artères et rejoignent le <b>système porte</b> : <b>veine gastrique gauche</b> → veine porte ; gastro-omentale gauche → splénique ; gastro-omentale droite → mésentérique supérieure.', trap: 'Au cardia, la veine gastrique gauche s’anastomose avec les veines œsophagiennes (→ azygos) : <b>anastomose porto-cave</b>. En hypertension portale → <b>varices œso-gastriques</b>, risque d’hémorragie massive.' },
    { x: .259, y: .559, t: 'Pylore & bulbe duodénal', p: 'Le pylore se projette en regard de <b>L1</b> (plan transpylorique), à droite de la ligne médiane. Repère chirurgical : la <b>veine prépylorique de Mayo</b>.', trap: 'Sténose hypertrophique du pylore du nourrisson (3–6 semaines) : vomissements en jet non bilieux, olive pylorique, <b>alcalose métabolique hypochlorémique hypokaliémique</b>.' },
    { x: .564, y: .518, portal: true, t: 'Ouvrir l’estomac', p: 'Plongez à travers la paroi antérieure : la <b>coupe frontale</b> révèle la configuration interne — cardia, fundus, corps, antre, canal pylorique — et les tuniques de la paroi.', trap: 'Fundus et corps portent les <b>glandes fundiques</b> (HCl, pepsinogène) ; l’antre porte les <b>glandes pyloriques</b> (cellules G, gastrine).', dive: 'Plonger : coupe frontale' } ] },
  { key: 'int', short: 'Interne', name: 'Coupe frontale', title: 'Coupe frontale & anatomie interne', crumb: 'Intérieur', realW: 34, portal: { c: [0.468, 0.424], w: 0.2 }, pins: [
    { x: .5, y: .308, t: 'Cardia & angle de His', p: 'Le <b>cardia</b> (jonction œso-gastrique) se projette à gauche de la ligne médiane, en regard de <b>T11</b>. L’<b>angle de His</b>, aigu, entre le bord gauche de l’œsophage et le fundus, participe au <b>dispositif anti-reflux</b> avec le sphincter inférieur de l’œsophage, la cravate de Helvétius et le pilier droit du diaphragme.', trap: 'Le cardia n’a pas de sphincter anatomique visible : le SIO est un sphincter <b>physiologique</b>. L’ouverture de l’angle de His (hernie hiatale par glissement) favorise le <b>RGO</b>.' },
    { x: .70, y: .27, t: 'Fundus (grosse tubérosité)', p: 'Partie la plus haute de l’estomac, au-dessus du plan horizontal passant par le cardia, sous la <b>coupole diaphragmatique gauche</b> ; il contient la <b>poche à air gastrique</b>.', trap: 'Les glandes dites « fundiques » tapissent le fundus <b>et le corps</b> ; l’antre contient des glandes pyloriques (cellules G).' },
    { x: .536, y: .455, t: 'Plis gastriques (rugae)', p: 'Plis de la <b>muqueuse et de la sous-muqueuse</b>, surtout longitudinaux, qui s’effacent à la distension (fonction de réservoir). Le long de la petite courbure, des plis parallèles forment la <b>rue gastrique</b> (canal de Waldeyer).', trap: 'La musculeuse ne participe pas aux plis. Des plis géants évoquent une <b>maladie de Ménétrier</b>.' },
    { x: .318, y: .598, t: 'Incisure angulaire', p: 'Angle de la petite courbure séparant le <b>corps</b> de l’<b>antre</b> ; repère endoscopique majeur, vu en rétrovision.', trap: 'Site de prédilection de l’<b>ulcère gastrique</b> : toute ulcération gastrique doit être <b>biopsiée</b> (cancer) et contrôlée après traitement.' },
    { x: .373, y: .652, t: 'Antre & canal pylorique', p: 'L’<b>antre</b> broie et brasse le chyme ; sa muqueuse contient les <b>glandes pyloriques</b> muqueuses et les <b>cellules G</b> (gastrine). Le canal pylorique mène au sphincter.', trap: 'La gastrine est <b>antrale</b> : une antrectomie supprime la stimulation gastrinique de la sécrétion acide.' },
    { x: .236, y: .665, t: 'Sphincter pylorique', p: 'Épaississement de la <b>couche circulaire</b> de la musculeuse : vrai <b>sphincter anatomique</b>. Il calibre la vidange (particules d’environ 2 mm) et limite le reflux duodéno-gastrique.', trap: 'Contrairement au cardia, le pylore est un sphincter anatomique, palpable en « olive » dans la sténose hypertrophique du nourrisson.' },
    { x: .611, y: .725, t: 'Musculeuse à trois couches', p: 'De dedans en dehors : <b>oblique interne</b>, <b>circulaire moyenne</b>, <b>longitudinale externe</b>, puis la séreuse (péritoine viscéral). Entre circulaire et longitudinale chemine le <b>plexus myentérique d’Auerbach</b>.', trap: 'La couche <b>oblique interne</b> est propre à l’estomac (brassage) : le reste du tube digestif n’a que deux couches.' },
    { x: .468, y: .424, portal: true, t: 'Révéler l’innervation', p: 'Le long de la petite courbure, dans le petit omentum, cheminent les <b>nerfs de Latarjet</b> issus des troncs vagaux. Plongez pour voir l’innervation extrinsèque (vague, sympathique) et intrinsèque (plexus entériques).', trap: 'Parasympathique (vague) = <b>sécrétion + motricité</b> ; sympathique (splanchniques) = <b>inhibition + douleur</b>.', dive: 'Plonger : innervation' } ] },
  { key: 'neuro', short: 'Nerfs', name: 'Innervation', title: 'Innervation : nerfs vagues & plexus cœliaque', crumb: 'Innervation', realW: 42, portal: { c: [0.846, 0.833], w: 0.2 }, pins: [
    { x: .468, y: .225, t: 'Troncs vagaux', p: 'Au hiatus œsophagien, le <b>nerf vague gauche</b> devient le <b>tronc vagal antérieur</b> et le <b>droit</b> le <b>postérieur</b> (rotation de l’estomac embryonnaire). Fibres parasympathiques pré-ganglionnaires : <b>sécrétion acide</b> (ACh, récepteurs M3) et <b>motricité</b>.', trap: 'Moyen mnémotechnique <b>LARP</b> : Left Anterior, Right Posterior.' },
    { x: .43, y: .562, t: 'Nerf de Latarjet', p: '<b>Nerf principal de la petite courbure</b> (antérieur et postérieur), issu du tronc vagal correspondant. Il descend dans le petit omentum le long de la petite courbure, donne des rameaux au corps, puis se termine en <b>patte d’oie</b> sur l’antre.', trap: '<b>Vagotomie supra-sélective</b> : section des rameaux fundiques et corporéaux en <b>préservant la patte d’oie</b> → baisse de la sécrétion acide sans gastroparésie (pas de pyloroplastie).' },
    { x: .336, y: .657, t: 'Terminaison en patte d’oie', p: 'Rameaux terminaux du nerf de Latarjet pour l’<b>antre</b> et le <b>pylore</b> : ils commandent la <b>motricité antro-pylorique</b>, donc la vidange gastrique.', trap: 'Après <b>vagotomie tronculaire</b>, la vidange est compromise : il faut y associer un drainage (pyloroplastie ou gastro-entérostomie).' },
    { x: .409, y: .443, t: 'Nerf criminel de Grassi', p: 'Branche du <b>tronc vagal postérieur</b> destinée au <b>fundus</b> (face postérieure), née haut, près du cardia.', trap: 'Oublié lors d’une vagotomie, il explique des <b>récidives ulcéreuses</b> — d’où son surnom de « criminel ».' },
    { x: .336, y: .331, t: 'Rameaux hépatiques du vague', p: 'Issus du <b>tronc vagal antérieur</b>, ils cheminent dans la partie haute du petit omentum vers le foie et les voies biliaires ; certains redescendent vers le pylore.', trap: 'Préservés lors d’une <b>vagotomie sélective</b> (contrairement à la tronculaire) pour limiter la diarrhée et les troubles biliaires post-vagotomie.' },
    { x: .668, y: .248, t: 'Ganglions cœliaques (plexus solaire)', p: 'Voie <b>sympathique</b> : nerfs grand et petit <b>splanchniques</b> (T5–T12) → relais dans les <b>ganglions cœliaques</b> → fibres post-ganglionnaires le long des artères. Effets : inhibition de la motricité et de la sécrétion, vasoconstriction ; transport de la <b>douleur viscérale</b>.', trap: 'La douleur gastrique est <b>épigastrique</b> (T6–T9) car les afférences nociceptives suivent le sympathique. Une neurolyse du plexus cœliaque soulage les douleurs des cancers sus-mésocoliques.' },
    { x: .849, y: .818, portal: true, t: 'Plexus d’Auerbach & de Meissner', p: 'Le <b>système nerveux entérique</b> fonctionne de façon autonome : <b>plexus myentérique d’Auerbach</b> (entre couches circulaire et longitudinale) → <b>motricité</b> ; <b>plexus sous-muqueux de Meissner</b> → <b>sécrétion</b> et débit sanguin muqueux.', trap: 'Auerbach = musculeuse = motricité ; Meissner = sous-muqueuse = sécrétion. Leur absence dans le côlon distal = <b>maladie de Hirschsprung</b>.', dive: 'Plonger dans la paroi' } ] },
  { key: 'histo', short: 'Histologie', name: 'Paroi gastrique', title: 'Histologie de la paroi & glandes fundiques', crumb: 'Paroi gastrique', realW: 0.24, portal: { c: [0.795, 0.49], w: 0.142 }, pins: [
    { x: .305, y: .269, t: 'Épithélium & cryptes (fovéoles)', p: '<b>Épithélium cylindrique simple mucosécrétant</b> à pôle muqueux fermé : mucus + bicarbonates = <b>barrière muco-bicarbonatée</b>. Dans la muqueuse fundique, les cryptes occupent environ le <b>quart</b> de la hauteur.', trap: 'L’estomac normal ne contient <b>pas de cellules caliciformes</b> : leur présence signe une <b>métaplasie intestinale</b> (lésion précancéreuse, souvent liée à <i>H. pylori</i>).' },
    { x: .29, y: .492, t: 'Glandes fundiques', p: 'Glandes <b>tubuleuses droites</b>, simples ou peu ramifiées, débouchant au fond des cryptes : <b>isthme</b> (cellules souches), <b>collet</b> (cellules mucipares), <b>corps et fond</b> (cellules pariétales et principales).', trap: 'Muqueuse fundique : cryptes courtes, glandes longues. Muqueuse pylorique : cryptes longues (≈ ½ de la hauteur), glandes courtes, contournées et muqueuses.' },
    { x: .336, y: .725, t: 'Les quatre tuniques', p: '<b>Muqueuse</b> (épithélium, chorion, <b>muscularis mucosae</b>) · <b>sous-muqueuse</b> (vaisseaux, plexus de Meissner) · <b>musculeuse</b> (3 couches, plexus d’Auerbach) · <b>séreuse</b> (péritoine viscéral).', trap: 'Cancer superficiel : <b>T1a</b> = limité à la muqueuse (jusqu’à la muscularis mucosae) ; <b>T1b</b> = atteinte de la sous-muqueuse. Le pronostic ganglionnaire change entre les deux.' },
    { x: .771, y: .409, t: 'Cellules mucipares du collet', p: 'Petites cellules du <b>collet</b> sécrétant un mucus soluble. L’<b>isthme</b> voisin abrite les cellules souches qui renouvellent l’épithélium de surface (en 3 à 5 jours) et les cellules glandulaires.', trap: 'Ce renouvellement rapide explique la cicatrisation des érosions en quelques jours — et la vulnérabilité aux <b>AINS</b>, qui suppriment les prostaglandines protectrices.' },
    { x: .668, y: .647, t: 'Cellules principales (zymogènes)', p: 'Au <b>fond des glandes</b> ; cytoplasme <b>basophile</b> (RER abondant), grains de zymogène apicaux : <b>pepsinogène</b> (activé en pepsine par l’HCl) et <b>lipase gastrique</b>.', trap: 'Basophile = principale (RER) ; <b>éosinophile</b> = pariétale (mitochondries) : question d’identification classique sur lame.' },
    { x: .722, y: .80, t: 'Cellules endocrines (ECL, G, D)', p: 'Cellules <b>ECL</b> (fundus) : <b>histamine</b>, stimulation paracrine des cellules pariétales (récepteurs H₂). Cellules <b>G</b> (antre) : <b>gastrine</b>. Cellules <b>D</b> : <b>somatostatine</b> (frein).', trap: 'Une <b>hypergastrinémie</b> (IPP au long cours, gastrite atrophique, syndrome de Zollinger-Ellison) entraîne une hyperplasie des cellules ECL, voire des tumeurs neuroendocrines.' },
    { x: .795, y: .497, portal: true, t: 'Cellules pariétales (bordantes)', p: 'Grandes cellules <b>éosinophiles</b> à noyau central, nombreuses dans la moitié supérieure des glandes : elles sécrètent l’<b>HCl</b> et le <b>facteur intrinsèque</b>, indispensable à l’absorption iléale de la vitamine B12.', trap: '<b>Gastrite auto-immune</b> (anticorps anti-cellules pariétales et anti-facteur intrinsèque) → <b>anémie de Biermer</b> (B12), achlorhydrie et hypergastrinémie.', dive: 'Plonger dans la cellule' } ] },
  { key: 'cell', short: 'Cellule', name: 'Cellule pariétale', title: 'Cellule pariétale & sécrétion d’HCl', crumb: 'Cellule pariétale', realW: 0.0026, portal: null, pins: [
    { x: .595, y: .243, t: 'Pompe à protons H⁺/K⁺-ATPase', p: 'Échange les <b>H⁺</b> cytoplasmiques contre des <b>K⁺</b> luminaux en hydrolysant de l’<b>ATP</b> ; elle crée un gradient d’environ <b>un million</b> (pH ≈ 1 contre 7,4). Le K⁺ est recyclé vers la lumière par des canaux apicaux.', trap: 'Les <b>IPP</b> (oméprazole…) sont des prodrogues activées en milieu acide qui bloquent la pompe de façon <b>irréversible</b> (pont disulfure) : à prendre <b>30 min avant le repas</b>, quand les pompes sont recrutées.' },
    { x: .414, y: .305, t: 'Canalicule sécrétoire intracellulaire', p: 'Invagination profonde de la membrane apicale bordée de <b>longues microvillosités</b>. Lors de la stimulation, la surface apicale est multipliée par 5 à 10 par fusion des tubulo-vésicules.', trap: 'Au repos : canalicule réduit, tubulo-vésicules abondantes. Stimulée : canalicule dilaté, microvillosités longues — <b>théorie du recyclage membranaire</b>.' },
    { x: .652, y: .409, t: 'Système tubulo-vésiculaire', p: 'Réservoir de membranes riches en <b>H⁺/K⁺-ATPase</b>. Sous l’effet de l’<b>AMPc</b> (histamine) et du <b>Ca²⁺</b> (acétylcholine, gastrine), ces vésicules fusionnent avec le canalicule.', trap: 'La sécrétion augmente en quelques minutes par <b>translocation</b> des pompes déjà synthétisées, pas par synthèse de novo.', note: 'La planche indique « Systrèmse » : il s’agit du système tubulo-vésiculaire.' },
    { x: .709, y: .637, t: 'Mitochondries abondantes', p: 'Environ <b>un tiers du volume cellulaire</b>, à crêtes denses : elles fournissent l’ATP consommé par la pompe et expliquent l’<b>acidophilie</b> de la cellule en coloration HE.', trap: 'Cellule pariétale éosinophile (mitochondries) ≠ cellule principale basophile (RER).' },
    { x: .254, y: .688, t: 'Récepteurs basolatéraux', p: '<b>H₂</b> (histamine, Gs → AMPc), <b>CCK2</b> (gastrine, Gq → Ca²⁺) et <b>M3</b> (acétylcholine, Gq → Ca²⁺) se potentialisent. La <b>somatostatine</b> et la prostaglandine E2 inhibent.', trap: 'La gastrine agit surtout <b>indirectement</b> en faisant libérer l’histamine par les cellules ECL : les anti-H2 freinent donc aussi la sécrétion déclenchée par le repas.' },
    { x: .238, y: .807, t: 'Vague alcaline', p: 'Pour chaque H⁺ sécrété, l’<b>anhydrase carbonique</b> (CO₂ + H₂O → H⁺ + HCO₃⁻) produit un <b>HCO₃⁻</b> qui sort au pôle basal vers le sang : le sang veineux gastrique s’alcalinise après les repas.', trap: 'Vomissements répétés (perte d’HCl) → <b>alcalose métabolique hypochlorémique</b>, aggravée par une hypokaliémie (hyperaldostéronisme secondaire).' },
    { x: .487, y: .766, t: 'Échangeur Cl⁻/HCO₃⁻', p: 'L’échangeur basolatéral (<b>AE2</b>) fait entrer le <b>Cl⁻</b> en échange du HCO₃⁻ ; le Cl⁻ ressort au pôle apical par des <b>canaux chlorure</b>. H⁺ et Cl⁻ s’associent dans la lumière.', trap: 'L’HCl n’est pas sécrété « tout fait » : H⁺ et Cl⁻ empruntent deux voies distinctes et s’associent dans la lumière du canalicule.' } ] },
